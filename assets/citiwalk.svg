<svg width="900" height="350" viewBox="0 0 900 350" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>CITIWALK Global Rewards — flagship public system</title>
  <desc>A typographic project banner describing the verified architecture and product surfaces in the public CITIWALK repository.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="15" x2="880" y2="335" gradientUnits="userSpaceOnUse"><stop stop-color="#111026"/><stop offset="0.5" stop-color="#0A1017"/><stop offset="1" stop-color="#06090D"/></linearGradient>
    <linearGradient id="accent" x1="42" y1="0" x2="858" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#6366F1"/><stop offset="0.52" stop-color="#38BDF8"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#FFFFFF" stroke-opacity="0.022"/></pattern>
  </defs>
  <style>
    .flow{stroke-dasharray:7 10;animation:flow 6s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes flow{to{stroke-dashoffset:-136}}@keyframes pulse{0%,100%{transform:scale(.8);opacity:.58}50%{transform:scale(1.2);opacity:1}}
    @media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none!important}}
  </style>
  <rect x="1" y="1" width="898" height="348" rx="28" fill="url(#bg)" stroke="#373A59" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="348" rx="28" fill="url(#grid)"/>
  <rect x="42" y="28" width="240" height="32" rx="16" fill="#171733" stroke="#4F46E5"/>
  <circle class="pulse" cx="61" cy="44" r="4" fill="#A5B4FC" filter="url(#glow)"/>
  <text x="75" y="49" fill="#C7D2FE" font-family="monospace" font-size="12" font-weight="800" letter-spacing="1.5">FLAGSHIP PUBLIC SYSTEM</text>
  <text x="42" y="123" fill="#F0F6FC" font-family="sans-serif" font-size="54" font-weight="800">CITIWALK</text>
  <text x="44" y="159" fill="#7DD3FC" font-family="monospace" font-size="16" font-weight="800" letter-spacing="2.3">GLOBAL REWARDS PLATFORM</text>
  <text x="44" y="196" fill="#B7C0CC" font-family="sans-serif" font-size="18" font-weight="600">Participant journey · protected admin console · server-side draw · analytics · PWA</text>

  <g transform="translate(44 229)">
    <path class="flow" d="M14 23H758" stroke="url(#accent)" stroke-width="2"/>
    <g fill="#0B1118" stroke-width="2"><circle cx="14" cy="23" r="8" stroke="#6366F1"/><circle cx="262" cy="23" r="8" stroke="#38BDF8"/><circle cx="510" cy="23" r="8" stroke="#32D399"/><circle cx="758" cy="23" r="8" stroke="#22C55E"/></g>
    <g fill="#C9D1D9" font-family="monospace" font-size="12" font-weight="800">
      <text x="14" y="52" text-anchor="start">REACT + TYPESCRIPT</text><text x="262" y="52" text-anchor="middle">FIREBASE AUTH</text><text x="510" y="52" text-anchor="middle">CLOUD FUNCTIONS</text><text x="758" y="52" text-anchor="middle">FIRESTORE</text>
    </g>
  </g>

  <rect x="42" y="307" width="816" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="44" y="331" fill="#687586" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.25">TYPE-SAFE PRODUCT UI  /  SERVER-AUTHORITATIVE WORKFLOWS  /  SECURITY RULES  /  TESTS</text>
</svg>
